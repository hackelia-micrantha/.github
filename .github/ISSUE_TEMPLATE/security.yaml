name: "Security report (private preferred)"
description: "Report a security concern without publicly exposing exploit details"
title: "[security]: "
labels: ["type:security", "status:needs-grooming"]
body:
  - type: markdown
    attributes:
      value: |
        Do NOT include exploit steps, payloads, credentials, sensitive data, or private findings in a public issue.
        Use SECURITY.md for private disclosure. Public content must remain safe to publish.

  - type: textarea
    id: human
    attributes:
      label: Explain it to a human
      description: In 1–3 plain-language, public-safe sentences, describe the risk and why it matters; omit exploit specifics.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: What needs to change
      description: The observable security property needed, without exploit details.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Security is not automatically P0 (see CONTRIBUTING.md).
      options:
        - P0 — interrupt (credible, immediate exposure or failure)
        - P1 — next (significant security or operability gap)
        - P2 — planned (hardening or architecture work)
        - P3 — later / explore (defense-in-depth improvement)
      default: 1
    validations:
      required: true

  - type: textarea
    id: tracking
    attributes:
      label: Tracking (public-safe only)
      description: Link public-safe evidence or state the private disclosure channel; omit sensitive details.
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Preferred private contact channel, if safe to make public.
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Confirmation
      options:
        - label: I understand that detailed security findings should be submitted privately via SECURITY.md.
          required: true
