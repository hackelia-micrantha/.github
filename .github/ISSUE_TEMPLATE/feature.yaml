name: "Feature request"
description: "Propose a bounded user or operator capability"
title: "[feat]: "
labels: ["type:feature", "status:needs-grooming"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the result, not a speculative implementation plan. Link existing designs and related requests.

  - type: textarea
    id: eli5
    attributes:
      label: Explain it to a 5 year old
      description: In 1–3 everyday sentences, say who needs what and why.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: What needs to change
      description: One observable capability, its intended user, and any important boundary or non-goal.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Two to five verifiable results when sufficient. Include meaningful negative/security cases.
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Repository-global urgency, not effort or readiness (see CONTRIBUTING.md).
      options:
        - P0 — interrupt (active break or dangerous exposure)
        - P1 — next (unlocks milestone or closes significant risk)
        - P2 — planned (important, does not displace P0/P1)
        - P3 — later / explore (uncommitted or exploratory)
      default: 2
    validations:
      required: true

  - type: textarea
    id: tracking
    attributes:
      label: Tracking (if applicable)
      description: Blockers, important tradeoffs, non-goals, and links to existing decisions or issues.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked for an existing issue or discussion covering this outcome.
          required: true
