name: "Bug report"
description: "Report a reproducible defect"
title: "[bug]: "
labels: ["type:bug", "status:needs-grooming"]
body:
  - type: markdown
    attributes:
      value: |
        Keep this short and link existing evidence. Redact secrets and personal data from public reports.

  - type: textarea
    id: eli5
    attributes:
      label: Explain it to a 5 year old
      description: In 1–3 everyday sentences, say what is wrong, why it matters, and what should be better.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: What needs to change
      description: Describe expected versus actual behavior and the affected version or environment.
      placeholder: "When I ..., I expected ..., but ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Smallest reproduction and relevant redacted error evidence. Link long logs or traces.
      placeholder: |
        1.
        2.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable fix or regression check, including important failure behavior.
      placeholder: "- [ ] ..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Repository-global urgency, not severity or blocked status (see CONTRIBUTING.md).
      options:
        - P0 — interrupt (active break or dangerous exposure)
        - P1 — next (unlocks milestone or closes significant risk)
        - P2 — planned (important, does not displace P0/P1)
        - P3 — later / explore (uncommitted or exploratory)
      default: 2
    validations:
      required: true

  - type: textarea
    id: tracking
    attributes:
      label: Tracking (if applicable)
      description: Version, blocker, non-goals, and authoritative links only. No repeated logs.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue with the same outcome.
          required: true
        - label: I redacted secrets and personal data.
          required: true
