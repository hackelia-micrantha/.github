name: Reusable mise CI

on:
  workflow_call:
    inputs:
      task:
        description: Mise task to run
        required: false
        type: string
        default: ci
      runner:
        description: GitHub runner label; custom self-hosted runners require Actions Runner v2.327.1+ for Node 24 actions
        required: false
        type: string
        default: ubuntu-latest
      working-directory:
        description: Repository-relative working directory
        required: false
        type: string
        default: .
      mise-version:
        description: Mise version to install
        required: false
        type: string
        default: 2026.7.13
      timeout_minutes:
        description: Maximum minutes for the delegated CI job
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  ci:
    name: mise / ${{ inputs.task }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: ${{ inputs.mise-version }}
          working_directory: ${{ inputs.working-directory }}
          install: true
          cache: true

      - name: Run mise task
        env:
          MISE_TASK: ${{ inputs.task }}
        run: mise run "$MISE_TASK"
