name: Meta validation

on:
  pull_request:
    paths:
      - .github/workflows/**
      - docs/automation/**
      - docs/prompts/**
      - metadata/**
      - tests/**
      - tools/repository_health.py
      - workflow-templates/**
      - mise.toml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - docs/automation/**
      - docs/prompts/**
      - metadata/**
      - tests/**
      - tools/repository_health.py
      - workflow-templates/**
      - mise.toml

permissions:
  contents: read

concurrency:
  group: meta-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: registry, prompts, templates, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Validate metadata and workflow templates
        run: python tools/repository_health.py validate

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
