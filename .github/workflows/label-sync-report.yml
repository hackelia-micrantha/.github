name: Label sync report

on:
  pull_request:
    paths:
      - metadata/labels.json
      - metadata/labels.schema.json
      - tools/label_sync.py
      - tests/test_label_sync.py
      - docs/standards/labels.md
      - .github/workflows/label-sync-report.yml
  push:
    branches:
      - main
    paths:
      - metadata/labels.json
      - metadata/labels.schema.json
      - tools/label_sync.py
      - tests/test_label_sync.py
      - docs/standards/labels.md
      - .github/workflows/label-sync-report.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: label-sync-report-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: report-only label plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate label metadata
        run: python tools/label_sync.py validate

      - name: Produce pilot plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/label_sync.py plan \
            --repository hackelia-micrantha/.github \
            --control-revision "$GITHUB_SHA" \
            --output-json label-sync-plan.json \
            --output-markdown label-sync-plan.md
          cat label-sync-plan.md >> "$GITHUB_STEP_SUMMARY"
