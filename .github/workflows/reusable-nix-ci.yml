name: Reusable Nix CI

on:
  workflow_call:
    inputs:
      command:
        description: Nix command to run
        required: false
        type: string
        default: nix flake check --print-build-logs
      runner:
        description: Exact reviewed repository runner label; caller must bind policy
        required: true
        type: string
      working-directory:
        description: Repository-relative working directory
        required: false
        type: string
        default: .
      extra-nix-config:
        description: Additional nix.conf settings
        required: false
        type: string
        default: ""
      enable-kvm:
        description: Enable KVM when supported by the runner
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: Maximum minutes for the delegated Nix job
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  check:
    name: nix / check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify reviewed JIT Nix substrate
        if: ${{ startsWith(inputs.runner, 'runner-') }}
        shell: bash
        env:
          EXTRA_NIX_CONFIG: ${{ inputs.extra-nix-config }}
          ENABLE_KVM: ${{ inputs.enable-kvm }}
        run: |
          set -euo pipefail
          if [[ -n "$EXTRA_NIX_CONFIG" || "$ENABLE_KVM" != "false" ]]; then
            echo "JIT Nix and KVM configuration must be owned by the reviewed runner/project policy." >&2
            exit 1
          fi
          command -v nix
          nix --version

      - name: Install Nix on reviewed external native runner
        if: ${{ !startsWith(inputs.runner, 'runner-') }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: ${{ inputs.extra-nix-config }}
          enable_kvm: ${{ inputs.enable-kvm }}

      - name: Run Nix validation
        env:
          NIX_COMMAND: ${{ inputs.command }}
        shell: bash
        run: bash -euo pipefail -c "$NIX_COMMAND"
