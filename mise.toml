[tools]
python = "3.13"

[tasks.validate]
description = "Validate repository metadata, source posture, and workflow-template layout"
run = "python tools/repository_health.py validate && python tools/source_posture.py metadata/repositories.json"

[tasks.test]
description = "Run automation unit tests"
run = "python -m unittest discover -s tests -v"

[tasks.health]
description = "Generate read-only repository-health and source-posture reports"
run = "python tools/repository_health.py health && python tools/source_posture.py --report metadata/repositories.json"

[tasks.ci]
description = "Run meta-repository validation and tests"
depends = ["validate", "test"]
