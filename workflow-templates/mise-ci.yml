name: Mise CI

on:
  # Installed templates are inert until the owner configures a runner and trigger.
  # Enable PR validation only with a separately reviewed trusted admission boundary.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Restrict even manual qualification to the repository's default branch.
  ci:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Immutable automation-v1 candidate. Update only through reviewed shared-workflow versioning.
    uses: hackelia-micrantha/.github/.github/workflows/reusable-mise-ci.yml@c0016c206607f6f101b8e6b70340ad7d4ab52837 # automation-v1 candidate
    with:
      task: ci
      # Replace with the registered exact JIT key and review fork boundaries before enabling PRs.
      runner: runner-REPLACE_WITH_APPROVED_KEY
