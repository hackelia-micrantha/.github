name: Mise CI

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]

permissions:
  contents: read

concurrency:
  group: mise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Immutable automation-v1 candidate. Update only through reviewed shared-workflow versioning.
    uses: hackelia-micrantha/.github/.github/workflows/reusable-mise-ci.yml@c0016c206607f6f101b8e6b70340ad7d4ab52837 # automation-v1 candidate
    with:
      task: ci
