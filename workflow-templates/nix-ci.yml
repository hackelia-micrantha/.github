name: Nix flake CI

on:
  # Templates do not execute PR-controlled workflow definitions on privileged JIT.
  # Enable PR validation only with a separately reviewed trusted admission boundary.
  push:
    branches: [$default-branch]

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Immutable automation-v1 candidate. Update only through reviewed shared-workflow versioning.
    uses: hackelia-micrantha/.github/.github/workflows/reusable-nix-ci.yml@c0016c206607f6f101b8e6b70340ad7d4ab52837 # automation-v1 candidate
    with:
      command: nix flake check --print-build-logs
      # Replace with the registered exact JIT key and review fork boundaries before enabling PRs.
      runner: runner-REPLACE_WITH_APPROVED_KEY
